# Configuration Netlify : lue automatiquement à chaque mise en ligne.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Application React : toutes les adresses (ex. /matieres/web/css) affichent index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Les fichiers de /assets ont un nom unique à chaque version : le navigateur les garde
# en cache un an, ce qui économise la bande passante (et donc les crédits Netlify).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
